name: release
# Run from Actions → release → Run workflow, or:
#   gh workflow run release -f version=0.1.2
# The released commit bumps the add-on version and moves CHANGELOG.md's
# [Unreleased] section under the version, copying the result to
# addon/CHANGELOG.md (Home Assistant's update dialog): it is tagged and its images are
# built first; master moves to it last, so Home Assistant never offers an
# add-on version whose image does not exist yet. The GitHub release notes
# are that CHANGELOG.md section.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the v, for example 0.1.2 or 0.2.0-rc1 (prerelease: no add-on bump)"
        required: true
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test -race ./...
      - run: python3 .github/scripts/test_changelog.py
  prepare:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the tag
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      sha: ${{ steps.tag.outputs.sha }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - id: check
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::version must look like 1.2.3 or 1.2.3-rc1, got '$VERSION'"
            exit 1
          fi
          if [[ "$VERSION" == *-* ]]; then echo prerelease=true; else echo prerelease=false; fi >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 0 # tags, to refuse an existing version
          # This job pushes the tag with the checkout's token.
          persist-credentials: true
      - id: tag
        env:
          PRERELEASE: ${{ steps.check.outputs.prerelease }}
        run: |
          tag="v$VERSION"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::$tag already exists"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ "$PRERELEASE" == false ]]; then
            # The add-on version follows the release; prereleases never
            # reach add-on users and leave CHANGELOG.md alone. Fails, before
            # anything is tagged, when [Unreleased] is empty.
            python3 .github/scripts/changelog.py release "$VERSION" "$(date -u +%F)"
            # Home Assistant shows the add-on folder's CHANGELOG.md on update.
            cp CHANGELOG.md addon/CHANGELOG.md
            sed -i -E "s/^version: .*/version: \"$VERSION\"/" addon/config.yaml
            git commit -am "release: $VERSION"
          fi
          git tag -a "$tag" -m "loqed-mqtt $VERSION"
          git push origin "refs/tags/$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  image:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - target: standalone
            image: ghcr.io/t3hk0d3/loqed-mqtt
            platforms: linux/amd64,linux/arm64,linux/arm/v7
          - target: addon
            image: ghcr.io/t3hk0d3/loqed-mqtt-addon
            platforms: linux/amd64,linux/arm64
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          # {{version}} drops the "v"; latest only for a final release.
          tags: type=semver,pattern={{version}},value=${{ needs.prepare.outputs.tag }}
          flavor: latest=${{ needs.prepare.outputs.prerelease == 'false' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platforms }}
          push: true
          build-args: VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
  publish:
    needs: [prepare, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write # move master, create the release
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      SHA: ${{ needs.prepare.outputs.sha }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 0
          # This job pushes master with the checkout's token.
          persist-credentials: true
      - name: Move master to the released commit
        if: needs.prepare.outputs.prerelease == 'false'
        run: |
          git fetch origin "refs/tags/$TAG:refs/tags/$TAG"
          if git push origin "$SHA:refs/heads/master"; then
            exit 0
          fi
          # master moved while the images were built: merge the tagged
          # commit, so master still contains exactly the released bump.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin master
          git checkout -B master origin/master
          git merge --no-edit "$TAG"
          git push origin master
      - name: Create the GitHub release
        run: |
          # Notes: the version's CHANGELOG.md section at the tag; for a
          # prerelease, the [Unreleased] section, or generated notes when
          # that is empty.
          git fetch origin "refs/tags/$TAG:refs/tags/$TAG"
          git show "$TAG:CHANGELOG.md" > "$RUNNER_TEMP/CHANGELOG.md"
          version="${TAG#v}"
          flags=(--verify-tag --title "loqed-mqtt $version")
          if [[ "$PRERELEASE" == true ]]; then
            flags+=(--prerelease)
            notes="$(python3 .github/scripts/changelog.py notes Unreleased "$RUNNER_TEMP/CHANGELOG.md")"
          else
            notes="$(python3 .github/scripts/changelog.py notes "$version" "$RUNNER_TEMP/CHANGELOG.md")"
          fi
          images="Images: \`ghcr.io/t3hk0d3/loqed-mqtt:$version\` (amd64, arm64, arm/v7) and \`ghcr.io/t3hk0d3/loqed-mqtt-addon:$version\` (amd64, arm64)."
          if [[ "$PRERELEASE" == true ]]; then
            images+=" Prereleases get no \`latest\` tag and no add-on version bump."
          fi
          if [[ -n "$notes" ]]; then
            printf '%s\n\n%s\n' "$notes" "$images" > "$RUNNER_TEMP/notes.md"
            flags+=(--notes-file "$RUNNER_TEMP/notes.md")
          else
            flags+=(--generate-notes)
          fi
          gh release create "$TAG" "${flags[@]}"
