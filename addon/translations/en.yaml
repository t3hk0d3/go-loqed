configuration:
  cloud_token:
    name: Personal access token
    description: Create one at https://integrations.loqed.com/personal-access-tokens. Leave empty to use email and password instead.
  cloud_email:
    name: LOQED email
    description: Used to create a personal access token automatically.
  cloud_password:
    name: LOQED password
    description: Only needed to create a token; can be removed after the first successful start.
  locks:
    name: Locks
    description: Names or ids of the locks to expose. Empty exposes every lock on the account.
  lock_settings:
    name: Lock settings
    description: Per-lock overrides (edit in YAML mode). key_names looks like "1=Alice,3=Bob".
  event_dedup_enabled:
    name: Deduplicate lock events
    description: Drop a lock event that repeats the previous one within the deduplication window (bridge and cloud copies, cloud re-deliveries). On by default.
  event_dedup_window:
    name: Event deduplication window
    description: A lock event repeating the previous one (bridge and cloud copies, cloud re-deliveries) within this time is dropped. Default 10s, at most 30s.
  webhook:
    name: Webhooks
    description: private_url is the address the bridge calls (auto-detected when empty). public_url (scheme and host only) enables cloud webhooks; the log then shows one URL per lock to register at app.loqed.com.
  mqtt:
    name: MQTT
    description: Leave url empty to use the Mosquitto add-on.
  homeassistant:
    name: Home Assistant discovery
  log_level:
    name: Log level
  log_format:
    name: Log format
