configuration:
  cloud_token:
    name: Personal access token
    description: Create one at https://integrations.loqed.com/personal-access-tokens. Leave empty to use email and password instead.
  cloud_email:
    name: LOQED email
    description: Used to create a personal access token automatically.
  cloud_password:
    name: LOQED password
    description: Used to create the token and to renew it before it expires (about every six months). Keep it set; without it, paste a new token manually.
  locks:
    name: Locks
    description: Names or ids of the locks to expose. Empty exposes every lock on the account.
  lock_settings:
    name: Lock settings
    description: Per-lock overrides (edit in YAML mode). key_names looks like "1=Alice,3=Bob".
  event_dedup_enabled:
    name: Deduplicate lock events
    description: Drop a lock event that repeats the previous one within the deduplication window (bridge and cloud copies, cloud re-deliveries). On by default.
  event_dedup_window:
    name: Event deduplication window
    description: A lock event repeating the previous one (bridge and cloud copies, cloud re-deliveries) within this time is dropped. Default 10s, at most 30s.
  webhook:
    name: Webhooks
    description: private_url is the address the bridge calls (auto-detected when empty). public_url (scheme and host only) enables cloud webhooks; the log then shows one URL per lock to register at app.loqed.com.
    fields:
      bridge_timestamp_tolerance:
        name: Bridge webhook timestamp tolerance
        description: How old a bridge webhook may be when it arrives. Default 20s; raise it if the log warns about stale timestamps (a bridge with many webhooks delivers late). 0 turns the check off.
  mqtt:
    name: MQTT
    description: Leave url empty to use the Mosquitto add-on. cloud_webhooks accepts LOQED cloud webhooks relayed by a Home Assistant automation (see Documentation).
    fields:
      cloud_webhooks:
        name: Cloud webhooks over MQTT
        description: Accept LOQED cloud webhook bodies on <base_topic>/<lock>/cloud_webhook, e.g. relayed from a Home Assistant Cloud webhook. Off by default.
      bridge_webhook_control:
        name: Bridge webhook changes over MQTT
        description: Accept SetWebhooks requests on <base_topic>/<lock>/webhooks/set, which add and remove webhooks on the bridge (see Documentation). The webhook list is shown either way. Off by default.
  homeassistant:
    name: Home Assistant discovery
  log_level:
    name: Log level
  log_format:
    name: Log format
